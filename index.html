<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pinai Application (Unified Premium)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Sarabun', sans-serif; background-color: #f8fafc; }
        .toast-animate { animation: slideDown 0.3s ease-out, fadeOut 0.3s ease-out 1.7s forwards; }
        @keyframes slideDown { from { transform: translate(-50%, -20px); opacity: 0; } to { transform: translate(-50%, 0); opacity: 1; } }
        @keyframes fadeOut { from { opacity: 1; } to { transform: translate(-50%, 0); opacity: 0; } }
        .hidden-page { display: none !important; }
        
        .table-custom { width: 100%; border-collapse: collapse; border: 2px solid #0f172a; background: white; table-layout: fixed; }
        .table-custom td { border: 2px solid #0f172a; padding: 0.75rem; font-size: 0.875rem; font-weight: 700; position: relative; min-height: 45px; word-wrap: break-word; vertical-align: middle; }
        .td-label { background-color: #f1f5f9; width: 35%; color: #1e293b; font-weight: 800; font-size: 0.85rem; }
    </style>
</head>
<body class="m-0 overflow-x-hidden">

    <div id="toast-container" class="fixed top-24 left-1/2 -translate-x-1/2 z-[100] pointer-events-none"></div>

    <!-- Main Navigation -->
    <div id="page-home" class="min-h-screen flex flex-col items-center justify-center p-6">
        <div class="max-w-4xl w-full text-center">
            <h1 class="text-4xl font-extrabold text-slate-800 mb-4 tracking-tight">ระบบบริหารจัดการพินัย</h1>
            <p class="text-slate-500 font-medium mb-12">กรุณาเลือกประเภทงานเพื่อเริ่มดำเนินการ</p>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 text-left max-w-2xl mx-auto">
                <div onclick="navigateTo('pinai-menu')" class="bg-white p-8 rounded-3xl shadow-sm border border-slate-200 hover:shadow-xl hover:border-blue-500 transition-all cursor-pointer group relative overflow-hidden">
                    <div class="absolute top-0 right-0 w-24 h-24 bg-blue-50 rounded-bl-full -mr-8 -mt-8 group-hover:bg-blue-100 transition-colors"></div>
                    <div class="w-14 h-14 bg-blue-600 rounded-2xl flex items-center justify-center text-white mb-6 shadow-lg shadow-blue-200">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" /></svg>
                    </div>
                    <h2 class="text-2xl font-bold text-slate-800 mb-2">เข้าสู่เมนูพินัย</h2>
                    <p class="text-slate-500 text-sm leading-relaxed">จัดการงานพินัยแยกตามประเภทและคัดลอกข้อมูล</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Pinai Menu -->
    <div id="page-pinai-menu" class="min-h-screen hidden-page flex flex-col items-center justify-center p-6">
        <div class="max-w-4xl w-full">
            <button onclick="navigateTo('home')" class="mb-8 flex items-center gap-2 text-slate-400 hover:text-slate-800 font-bold text-sm transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" /></svg> กลับหน้าหลัก
            </button>
            <div class="text-center mb-10">
                <h1 class="text-4xl font-extrabold text-slate-800 mb-2 tracking-tight">เมนูพินัย</h1>
                <p class="text-slate-500 font-medium text-lg">จัดการงานพินัยแยกตามประเภท</p>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div onclick="navigateTo('v1')" class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 hover:border-rose-400 hover:shadow-md transition-all cursor-pointer group">
                    <div class="w-10 h-10 bg-rose-100 text-rose-600 rounded-xl flex items-center justify-center mb-4 group-hover:bg-rose-500 group-hover:text-white transition-colors font-bold">P</div>
                    <h3 class="text-base font-bold text-slate-800 uppercase">พินัยอนุมัติผิด</h3>
                </div>
                <div onclick="navigateTo('one-percent')" class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 hover:border-blue-400 hover:shadow-md transition-all cursor-pointer group">
                    <div class="w-10 h-10 bg-blue-100 text-blue-600 rounded-xl flex items-center justify-center mb-4 group-hover:bg-blue-500 group-hover:text-white transition-colors font-bold">1%</div>
                    <h3 class="text-base font-bold text-slate-800 uppercase">พินัย 1%</h3>
                </div>
                <div onclick="navigateTo('delayed')" class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 hover:border-indigo-400 hover:shadow-md transition-all cursor-pointer group">
                    <div class="w-10 h-10 bg-indigo-100 text-indigo-600 rounded-xl flex items-center justify-center mb-4 group-hover:bg-indigo-500 group-hover:text-white transition-colors font-bold">D</div>
                    <h3 class="text-base font-bold text-slate-800 uppercase">พินัยล่าช้า</h3>
                </div>
                <div onclick="navigateTo('exempt-backdated')" class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 hover:border-purple-400 hover:shadow-md transition-all cursor-pointer group">
                    <div class="w-10 h-10 bg-purple-100 text-purple-600 rounded-xl flex items-center justify-center mb-4 group-hover:bg-purple-500 group-hover:text-white transition-colors font-bold">E</div>
                    <h3 class="text-base font-bold text-slate-800 uppercase">พินัยมีหนังสือยกเว้นย้อนหลัง</h3>
                </div>
                <div onclick="navigateTo('wrong-class')" class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 hover:border-emerald-400 hover:shadow-md transition-all cursor-pointer group">
                    <div class="w-10 h-10 bg-emerald-100 text-emerald-600 rounded-xl flex items-center justify-center mb-4 group-hover:bg-emerald-500 group-hover:text-white transition-colors font-bold">C</div>
                    <h3 class="text-base font-bold text-slate-800 uppercase">พินัยคลาสผิด</h3>
                </div>
                <div onclick="navigateTo('trailer')" class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 hover:border-amber-400 hover:shadow-md transition-all cursor-pointer group">
                    <div class="w-10 h-10 bg-amber-100 text-amber-600 rounded-xl flex items-center justify-center mb-4 group-hover:bg-amber-500 group-hover:text-white transition-colors font-bold">T</div>
                    <h3 class="text-base font-bold text-slate-800 uppercase">พินัยพ่วงหลัง</h3>
                </div>
            </div>
        </div>
    </div>

    <div id="work-pages-container"></div>

    <script>
        // --- DATA & CONFIG ---
        const versionConfigs = {
            'v1': { name: 'พินัยอนุมัติผิด', color: 'bg-rose-600', text: 'text-rose-600', type: 'standard' },
            'one-percent': { name: 'พินัย 1%', color: 'bg-blue-600', text: 'text-blue-600', type: 'special-1percent' },
            'delayed': { name: 'พินัยล่าช้า', color: 'bg-indigo-600', text: 'text-indigo-600', type: 'special-1percent' },
            'exempt-backdated': { name: 'พินัยมีหนังสือยกเว้นย้อนหลัง', color: 'bg-purple-600', text: 'text-purple-600', type: 'special-1percent' },
            'wrong-class': { name: 'พินัยคลาสผิด', color: 'bg-emerald-600', text: 'text-emerald-600', type: 'wrong-class' },
            'trailer': { name: 'พินัยพ่วงหลัง', color: 'bg-amber-600', text: 'text-amber-600', type: 'trailer' }
        };

        // ปรับปรุงฟังก์ชันจัดการคีย์บอร์ดเฉพาะตอนกด Spacebar
        function handleInvoiceKeydown(event, input) {
            if (event.key === " ") {
                event.preventDefault(); // ป้องกันการเว้นวรรคปกติ
                const start = input.selectionStart;
                const end = input.selectionEnd;
                const value = input.value;
                
                // ตรวจสอบว่าข้างหน้าเป็นคอมม่าอยู่แล้วหรือไม่ เพื่อป้องกันการซ้ำ
                const beforeText = value.substring(0, start);
                if (beforeText.trim().endsWith(",")) {
                    return;
                }

                // ใส่ " , " แทนช่องว่าง
                input.value = value.substring(0, start) + " , " + value.substring(end);
                
                // เลื่อนเคอร์เซอร์ไปหลังคอมม่า
                const newPos = start + 3;
                input.setSelectionRange(newPos, newPos);
                
                // อัปเดตพรีวิว
                const vId = input.id.split('-')[1];
                refreshView(vId);
            }
        }

        function formatToAD(str) {
            if (!str || str === "-") return "-";
            return str.replace(/25(\d{2})/g, (match, p1) => {
                const year = parseInt(match);
                if (year > 2500 && year < 2600) return year - 543;
                return match;
            });
        }

        function formatToBE(str) {
            if (!str || str === "-") return "-";
            return str.replace(/20(\d{2})/g, (match, p1) => {
                const year = parseInt(match);
                if (year > 2000 && year < 2100) return year + 543;
                return match;
            });
        }

        function navigateTo(pageId) {
            document.querySelectorAll('[id^="page-"]').forEach(p => p.classList.add('hidden-page'));
            const target = document.getElementById('page-' + pageId);
            if (target) {
                target.classList.remove('hidden-page');
            }
            window.scrollTo(0, 0);
        }

        function showToast(msg) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'bg-slate-800 text-white px-6 py-3 rounded-2xl shadow-2xl flex items-center gap-3 border border-slate-700 toast-animate mb-2 pointer-events-auto';
            toast.innerHTML = `<div class="w-6 h-6 bg-emerald-500 rounded-full flex items-center justify-center"><svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor"><path fillRule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 01.414 0z" clipRule="evenodd" /></svg></div><span class="font-bold text-sm">${msg}</span>`;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 2000);
        }

        function copyToClipboard(text, label) {
            if (!text || text === "-") {
                showToast("ไม่มีข้อมูลให้คัดลอก");
                return;
            }
            const el = document.createElement('textarea');
            el.value = text;
            document.body.appendChild(el);
            el.select();
            document.execCommand('copy');
            document.body.removeChild(el);
            showToast("คัดลอก: " + label);
        }

        function setupWorkPages() {
            const container = document.getElementById('work-pages-container');
            container.innerHTML = '';
            Object.keys(versionConfigs).forEach(vId => {
                const config = versionConfigs[vId];
                const section = document.createElement('div');
                section.id = `page-${vId}`;
                section.className = 'min-h-screen hidden-page flex flex-col pb-12';
                section.innerHTML = `
                    <div class="bg-white border-b border-slate-200 px-6 py-4 flex justify-between items-center sticky top-0 z-10 shadow-sm">
                        <button onclick="navigateTo('pinai-menu')" class="flex items-center gap-2 text-slate-500 hover:text-slate-800 font-bold text-sm transition-colors">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" /></svg> กลับ
                        </button>
                        <div class="flex items-center gap-2">
                            <div class="w-6 h-6 ${config.color} rounded flex items-center justify-center text-white text-[10px] font-bold">${config.name.charAt(0)}</div>
                            <span class="font-extrabold text-slate-700 uppercase tracking-tight">${config.name}</span>
                        </div>
                        <button onclick="resetInputs('${vId}')" class="text-rose-500 hover:bg-rose-50 px-3 py-1 rounded-lg text-xs font-bold transition-all border border-transparent hover:border-rose-100">ล้าง</button>
                    </div>
                    <div class="max-w-5xl mx-auto w-full p-6">
                        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
                            <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-200 h-fit">
                                <h3 class="text-lg font-bold text-slate-800 mb-6 flex items-center gap-2"><span class="w-2 h-6 ${config.color} rounded-full"></span> ฟอร์มข้อมูล</h3>
                                <div class="grid grid-cols-1 md:grid-cols-2 gap-4" id="fields-${vId}"></div>
                            </div>
                            <div class="flex flex-col gap-4">
                                <div class="bg-white p-8 rounded-[2.5rem] shadow-xl border border-slate-200 relative overflow-hidden" id="pdf-content-${vId}">
                                    <div class="absolute top-0 left-0 w-full h-2 ${config.color}"></div>
                                    <h4 class="${config.text} font-black text-2xl tracking-tight mb-6">${config.name}</h4>
                                    <table class="table-custom" id="table-view-${vId}"></table>
                                    <div class="mt-4 p-4 bg-yellow-50 border-2 border-dashed border-yellow-400 rounded-2xl text-[13px] font-bold text-slate-700" id="yellow-msg-${vId}"></div>
                                    <div class="mt-8 grid grid-cols-1 gap-2" id="copy-buttons-${vId}">
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
                container.appendChild(section);
                renderFields(vId);
                refreshView(vId);
            });
        }

        function renderFields(vId) {
            const config = versionConfigs[vId];
            const fieldsContainer = document.getElementById(`fields-${vId}`);
            let fields = [];
            
            const baseFieldsTop = [
                { id: 'passTime', label: 'วัน-เวลา ผ่านทาง', placeholder: '01/02/2567 10:30' },
                { id: 'approveTime', label: 'วัน-เวลา อนุมัติ', placeholder: '01/02/2567 11:00' },
                { id: 'invoiceDate', label: 'วันที่เกิดใบแจ้งหนี้', placeholder: '01/02/2567' },
                { id: 'invoiceNo', label: 'เลขที่ใบแจ้งหนี้', placeholder: 'กด Spacebar เพื่อแยกข้อมูลด้วย , ', span: 2 }
            ];

            const baseFieldsBottom = [
                { id: 'carType', label: 'ประเภทรถ', type: 'select', options: ['4 ล้อ', '6 ล้อ', 'มากกว่า 6 ล้อ'] },
                { id: 'station', label: 'ด่าน', type: 'select', options: ['ด่านธัญบุรี 1', 'ด่านธัญบุรี 2', 'ด่านทับช้าง 1', 'ด่านทับช้าง 2'] },
                { id: 'lane', label: 'เลน', type: 'select', options: ['1', '2', '3', '4'] },
                { id: 'note', label: 'คำอธิบายเพิ่มเติม', placeholder: 'หมายเหตุ...', span: 2 }
            ];

            if (vId === 'one-percent') {
                fields = [
                    { id: 'plate', label: 'ทะเบียน', placeholder: '1กข 1234' },
                    { id: 'complaintType', label: 'ประเภทการร้องเรียน', type: 'select', options: ['ไม่ทราบว่าเป็นระบบ M-Flow', 'ระบบไม่แสดงยอดชำระ', 'อื่นๆ'] },
                    ...baseFieldsTop,
                    { id: 'otherReason', label: 'ระบุเหตุผลอื่นๆ', placeholder: 'กรุณากรอกเหตุผล...', span: 2, isHidden: true },
                    ...baseFieldsBottom
                ];
            } else if (config.type === 'wrong-class') {
                fields = [
                    { id: 'plate', label: 'ทะเบียน', placeholder: '1กข 1234' },
                    ...baseFieldsTop,
                    { id: 'correctPlate', label: 'คลาสรถที่วิ่งใช้ทางจริง', type: 'select', options: ['4 ล้อ (C1)', '6 ล้อ (C2)', 'มากกว่า 6 ล้อ (C3)'] },
                    ...baseFieldsBottom
                ];
            } else if (config.type === 'trailer') {
                fields = [
                    { id: 'plateFront', label: 'ทะเบียนส่วนหน้า', placeholder: '1กข 1234' },
                    { id: 'plateTrailer', label: 'ทะเบียนส่วนพ่วงหลัง', placeholder: 'พ-5678' },
                    ...baseFieldsTop,
                    ...baseFieldsBottom
                ];
            } else if (config.type === 'special-1percent') {
                fields = [{ id: 'plate', label: 'ทะเบียน', placeholder: '1กข 1234' }, ...baseFieldsTop, ...baseFieldsBottom];
            } else {
                fields = [
                    { id: 'plateWrong', label: 'ทะเบียนที่ผิด', placeholder: '1กข 1234' },
                    { id: 'plateRight', label: 'ทะเบียนที่ถูก', placeholder: '2กค 5678' },
                    ...baseFieldsTop,
                    ...baseFieldsBottom
                ];
            }

            fieldsContainer.innerHTML = fields.map(f => {
                const isInvoiceField = f.id === 'invoiceNo';
                const inputAttrs = isInvoiceField 
                    ? `onkeydown="handleInvoiceKeydown(event, this)" oninput="refreshView('${vId}')"` 
                    : `oninput="refreshView('${vId}')"`;

                return `
                <div id="wrapper-${vId}-${f.id}" class="flex flex-col gap-1 ${f.span ? 'md:col-span-2' : ''} ${f.isHidden ? 'hidden' : ''}">
                    <label class="text-[11px] font-bold text-slate-400 uppercase tracking-wider">${f.label}</label>
                    ${f.type === 'select' ? 
                        `<select id="input-${vId}-${f.id}" onchange="onSelectChange('${vId}', '${f.id}')" class="w-full border border-slate-200 p-2.5 rounded-xl text-sm bg-slate-50 focus:bg-white focus:ring-2 ring-blue-100 outline-none transition-all font-bold cursor-pointer">
                            <option value="">เลือก${f.label}</option>
                            ${f.options.map(o => `<option value="${o}">${o}</option>`).join('')}
                        </select>` :
                        f.id === 'otherReason' || f.id === 'note' ?
                        `<textarea id="input-${vId}-${f.id}" oninput="refreshView('${vId}')" placeholder="${f.placeholder}" class="w-full border border-slate-200 p-2.5 rounded-xl text-sm bg-slate-50 focus:bg-white focus:ring-2 ring-blue-100 outline-none transition-all font-bold h-24">${vId === 'exempt-backdated' && f.id === 'note' ? 'เป็นรายการผ่านทาง (ที่มีหนังสือยกเว้น)' : ''}</textarea>` :
                        `<input id="input-${vId}-${f.id}" ${inputAttrs} placeholder="${f.placeholder}" class="w-full border border-slate-200 p-2.5 rounded-xl text-sm bg-slate-50 focus:bg-white focus:ring-2 ring-blue-100 outline-none transition-all font-bold" />`
                    }
                </div>`;
            }).join('');
        }

        function onSelectChange(vId, fId) {
            if (vId === 'one-percent' && fId === 'complaintType') {
                const val = document.getElementById(`input-${vId}-${fId}`).value;
                const wrapper = document.getElementById(`wrapper-${vId}-otherReason`);
                if (val === 'อื่นๆ') {
                    wrapper.classList.remove('hidden');
                } else {
                    wrapper.classList.add('hidden');
                    document.getElementById(`input-${vId}-otherReason`).value = "";
                }
            }
            refreshView(vId);
        }

        function refreshView(vId) {
            const config = versionConfigs[vId];
            const data = {};
            document.querySelectorAll(`[id^="input-${vId}-"]`).forEach(input => {
                const fId = input.id.replace(`input-${vId}-`, '');
                data[fId] = input.value || "-";
            });

            const pt = formatToBE(data.passTime);
	    const at = formatToBE(data.approveTime);
            const idt = formatToBE(data.invoiceDate);

            const table = document.getElementById(`table-view-${vId}`);
            const yellowMsg = document.getElementById(`yellow-msg-${vId}`);
            let rows = [];
            let extraButtons = "";

            if (vId === 'one-percent') {
                rows = [
                    ["ทะเบียน", data.plate],
                    ["วัน-เวลา ผ่านทาง", pt],
                    ["วัน-เวลา อนุมัติ", at],
                    ["วันที่เกิดใบแจ้งหนี้", idt],
                    ["เลขที่ใบแจ้งหนี้", data.invoiceNo],
                    ["ประเภทรถ", data.carType],
                    ["ด่าน", data.station],
                    ["เลน", data.lane],
                    ["รูปทะเบียน รูปหน้ารถ", "-"],
                    ["คำอธิบายเพิ่มเติม", data.note]
                ];

                if (data.complaintType === 'ไม่ทราบว่าเป็นระบบ M-Flow') {
                    yellowMsg.innerText = "ข้าพเจ้าได้รับหนังสือค่าปรับจากทาง M-Flow โดยแจ้งว่าหลีกเลี่ยงชำระค่าผ่านทาง แต่ข้าพเจ้ายืนยันว่าไม่ได้มีเจตนาหลีกเลี่ยง เนื่องจากข้าพเจ้าไม่ทราบว่าเป็นระบบ M-Flow เเละไม่ได้รับการเเจ้งเตือนแต่อย่างใด ข้าพเจ้ารู้สึกไม่ได้รับความเป็นธรรม ยินดีชำระค่าผ่านทางตามจริง";
                } else if (data.complaintType === 'ระบบไม่แสดงยอดชำระ') {
                    yellowMsg.innerText = "ข้าพเจ้าได้รับหนังสือค่าปรับจากทาง M-Flow โดยแจ้งว่าหลีกเลี่ยงชำระค่าผ่านทาง แต่ข้าพเจ้ายืนยันว่าได้เข้ามาค้นหายอดเเล้วเเต่ระบบไม่เเสดงยอดให้ชำระเงิน ไม่ได้มีเจตนาหลีกเลี่ยง ข้าพเจ้ารู้สึกไม่ได้รับความเป็นธรรมที่ต้องชำระพร้อมค่าปรับ จึงขอพิจารณาค่าปรับ ยินดีชำระค่าผ่านทางตามจริง";
                } else if (data.complaintType === 'อื่นๆ') {
                    yellowMsg.innerText = data.otherReason !== "-" ? data.otherReason : "(กรุณาระบุเหตุผลอื่นๆ ในช่องกรอกข้อมูลด้านซ้าย)";
                } else {
                    yellowMsg.innerText = "กรุณาเลือกประเภทการร้องเรียน";
                }
            } else if (config.type === 'wrong-class') {
                let classDesc = "-";
                let rejectReason = "กรุณาเลือกคลาสรถที่วิ่งใช้ทางจริง";

                if (data.correctPlate.includes("C1")) {
                    classDesc = "4 ล้อ (C1)";
                    rejectReason = "ระบบคิดรายการค่าผ่านทางไม่ถูกต้อง และ Class รถไม่ถูกต้อง ราคาที่ถูกต้อง คือ 30 บาท Class รถ C1 = 4 ล้อ";
                } else if (data.correctPlate.includes("C2")) {
                    classDesc = "6 ล้อ (C2)";
                    rejectReason = "ระบบคิดรายการค่าผ่านทางไม่ถูกต้อง และ Class รถไม่ถูกต้อง ราคาที่ถูกต้อง คือ 50 บาท Class รถ C2 = 6 ล้อ";
                } else if (data.correctPlate.includes("C3")) {
                    classDesc = "มากกว่า 6 ล้อ (C3)";
                    rejectReason = "ระบบคิดรายการค่าผ่านทางไม่ถูกต้อง และ Class รถไม่ถูกต้อง ราคาที่ถูกต้อง คือ 70 บาท Class รถ C3 = มากกว่า 6 ล้อ";
                }

                const finalNote = data.note !== "-" ? `คลาสรถที่วิ่งใช้ทางจริง : ${classDesc} ${data.note}` : `คลาสรถที่วิ่งใช้ทางจริง : ${classDesc}`;
                
                rows = [
                    ["ทะเบียน", data.plate],
                    ["วัน-เวลา ผ่านทาง", pt],
                    ["วัน-เวลา อนุมัติ", at],
                    ["วันที่เกิดใบแจ้งหนี้", idt],
                    ["เลขที่ใบแจ้งหนี้", data.invoiceNo],
                    ["ประเภทรถ", data.carType],
                    ["ด่าน", data.station],
                    ["เลน", data.lane],
                    ["รูปทะเบียน", ""],
                    ["คำอธิบายเพิ่มเติม", finalNote]
                ];
                yellowMsg.innerText = rejectReason;
            } else if (config.type === 'trailer') {
                rows = [
                    ["ทะเบียน", data.plateTrailer],
                    ["วัน-เวลา ผ่านทาง", pt],
                    ["วัน-เวลา อนุมัติ", at],
                    ["วันที่เกิดใบแจ้งหนี้", idt],
                    ["เลขที่ใบแจ้งหนี้", data.invoiceNo],
                    ["ประเภทรถ", data.carType],
                    ["ด่าน", data.station],
                    ["เลน", data.lane],
                    ["หมายเหตุ", data.note]
                ];
                yellowMsg.innerText = `ขอปฏิเสธการโต้แย้ง เนื่องจากรถทะเบียน ${data.plateTrailer} ซึ่งเป็นส่วนพ่วงหลัง ได้ผ่านทางเมื่อวันที่ ${pt} จริง`;
                extraButtons = `
                    <div class="grid grid-cols-2 gap-2 mb-2">
                        <button onclick="copyToClipboard('${data.plateFront}', 'ทะเบียนส่วนหน้า')" class="bg-indigo-50 text-indigo-700 border border-indigo-200 p-2 rounded-xl font-bold text-xs hover:bg-indigo-100 uppercase transition-all">คัดลอกทะเบียนหน้า</button>
                        <button onclick="copyToClipboard('${data.plateTrailer}', 'ทะเบียนส่วนพ่วง')" class="bg-amber-50 text-amber-700 border border-amber-200 p-2 rounded-xl font-bold text-xs hover:bg-amber-100 uppercase transition-all">คัดลอกทะเบียนพ่วง</button>
                    </div>
                `;
            } else if (config.type === 'special-1percent') {
                rows = [
                    ["ทะเบียน", data.plate],
                    ["วัน-เวลา ผ่านทาง", pt],
                    ["วัน-เวลา อนุมัติ", at],
                    ["วันที่เกิดใบแจ้งหนี้", idt],
                    ["เลขที่ใบแจ้งหนี้", data.invoiceNo],
                    ["ประเภทรถ", data.carType],
                    ["ด่าน", data.station],
                    ["เลน", data.lane],
                    ["รูปทะเบียน รูปหน้ารถ", "-"],
                    ["หมายเหตุ", data.note]
                ];
                if (vId === 'delayed') yellowMsg.innerText = `ข้าพเจ้าไม่ได้สมัครสมาชิกแต่มีการวิ่งผ่านทาง Mflow ด้วยทะเบียน ${data.plate} เเต่ระบบมีการสร้างรายการย้อนหลังโดยที่ไม่แจ้งให้ข้าพเจ้าทราบจึงทำให้เกิดค่าปรับ ข้าพเจ้าขอพิจารณาค่าปรับ ยินดีชำระเฉพาะค่าผ่านทางตามจริง เป็นรายการผ่านทางตั้งแต่วันที่ ${pt}`;
                else if (vId === 'exempt-backdated') yellowMsg.innerText = `ขอตรวจสอบข้อมูลพินัยมีหนังสือยกเว้นย้อนหลัง สำหรับทะเบียน ${data.plate} รายการผ่านทางวันที่ ${pt}`;
            } else if (vId === 'v1') {
                rows = [
                    ["ทะเบียน", data.plateWrong],
                    ["วัน-เวลา ผ่านทาง", pt],
                    ["วัน-เวลา อนุมัติ", at],
                    ["วันที่เกิดใบแจ้งหนี้", idt],
                    ["เลขที่ใบแจ้งหนี้", data.invoiceNo],
                    ["ประเภทรถ", data.carType],
                    ["ด่าน", data.station],
                    ["เลน", data.lane],
                    ["หมายเหตุ", data.note]
                ];
                yellowMsg.innerText = `ข้าพเจ้าขอปฏิเสธรายการผ่านทางของทะเบียน ${data.plateWrong} เนื่องจากไม่ได้ผ่านทางในวันที่ ${pt}`;
                
                extraButtons = `
                    <div class="grid grid-cols-2 gap-2 mb-2">
                        <button onclick="copyToClipboard('${data.plateWrong}', 'ทะเบียนผิด')" class="bg-rose-50 text-rose-700 border border-rose-200 p-2 rounded-xl font-bold text-xs hover:bg-rose-100 transition-colors uppercase">คัดลอกทะเบียนผิด</button>
                        <button onclick="copyToClipboard('${data.plateRight}', 'ทะเบียนถูก')" class="bg-emerald-50 text-emerald-700 border border-emerald-200 p-2 rounded-xl font-bold text-xs hover:bg-emerald-100 transition-colors uppercase">คัดลอกทะเบียนถูก</button>
                    </div>
                `;
            }

            table.innerHTML = rows.map(r => `<tr><td class="td-label">${r[0]}</td><td><div style="white-space: pre-wrap;">${r[1]}</div></td></tr>`).join('');
            
            const btnContainer = document.getElementById(`copy-buttons-${vId}`);
            btnContainer.innerHTML = `
                ${extraButtons}
                <button onclick="copySmartTableData('${vId}')" class="bg-slate-900 text-white p-3 rounded-2xl font-bold text-xs hover:bg-slate-800 active:scale-95 transition-all w-full">📋 คัดลอกข้อมูลตาราง (Smart Copy)</button>
                <button onclick="copyYellowMsg('${vId}')" class="bg-yellow-400 text-slate-900 p-3 rounded-2xl font-bold text-xs hover:bg-yellow-500 active:scale-95 transition-all w-full mt-2">คัดลอกข้อความปฏิเสธ</button>
            `;
        }

        function copySmartTableData(vId) {
            const table = document.getElementById(`table-view-${vId}`);
            const rows = Array.from(table.querySelectorAll('tr'));
            let collectedValues = [];

            if (vId === 'trailer' || vId === 'v1') {
                for (let i = 0; i <= 7; i++) {
                    if (rows[i]) {
                        const cells = rows[i].querySelectorAll('td');
                        if (cells.length > 1) collectedValues.push(cells[1].innerText.trim());
                    }
                }
            } else {
                rows.forEach((row) => {
                    const cells = row.querySelectorAll('td');
                    if (cells.length > 1) collectedValues.push(cells[1].innerText.trim());
                });
            }

            if (collectedValues.length > 0) copyToClipboard(collectedValues.join("\n"), "ข้อมูลตาราง");
            else showToast("ไม่พบข้อมูล");
        }

        function copyYellowMsg(vId) {
            const msg = document.getElementById(`yellow-msg-${vId}`).innerText;
            if (msg.includes("กรุณาเลือก")) {
                showToast("กรุณาเลือกข้อมูลให้ครบก่อน");
                return;
            }
            copyToClipboard(msg, "ข้อความปฏิเสธ");
        }

        function resetInputs(vId) {
            document.querySelectorAll(`[id^="input-${vId}-"]`).forEach(input => {
                input.value = "";
                if (vId === 'exempt-backdated' && input.id.includes('note')) {
                    input.value = "เป็นรายการผ่านทาง (ที่มีหนังสือยกเว้น)";
                }
            });
            const otherWrapper = document.getElementById(`wrapper-${vId}-otherReason`);
            if (otherWrapper) otherWrapper.classList.add('hidden');
            refreshView(vId);
            showToast("ล้างข้อมูลแล้ว");
        }

        window.onload = () => {
            setupWorkPages();
            navigateTo('home');
        };
    </script>
</body>
</html>
